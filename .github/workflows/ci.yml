name: CI/CD

on:
  push:
    branches:
      - main
      - dev-pydanticAI
      - feature/**
      - codex/**
  pull_request:
    branches:
      - main
      - dev-pydanticAI
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  quality:
    name: Build, lint, test, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Backend static check (ruff lint)
        run: uv run ruff check backend tests

      - name: Backend format check
        run: uv run ruff format --check backend tests

      - name: Backend compile check
        env:
          PYTHONPYCACHEPREFIX: artifacts/pycache
        run: uv run python -m compileall backend tests

      - name: Backend tests with coverage
        run: |
          mkdir -p artifacts/test-results artifacts/coverage
          uv run pytest \
            --junitxml=artifacts/test-results/pytest.xml \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-report=html:artifacts/coverage/html

      - name: Backend package build
        run: uv build --wheel --out-dir artifacts/backend-dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Collect frontend build artifact
        run: |
          mkdir -p artifacts/frontend-dist
          cp -R frontend/dist/. artifacts/frontend-dist/

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: |
            artifacts/test-results
            artifacts/coverage
          retention-days: 14

      - name: Upload build outputs
        uses: actions/upload-artifact@v5
        with:
          name: build-outputs
          path: |
            artifacts/backend-dist
            artifacts/frontend-dist
          retention-days: 14

  code-analysis:
    name: Code metrics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install analysis tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cloc
          pip install lizard

      - name: Run cloc & lizard
        run: |
          mkdir -p artifacts/code-metrics
          cloc backend frontend/src \
            --json --out=artifacts/code-metrics/cloc.json
          cloc backend frontend/src \
            --out=artifacts/code-metrics/cloc.txt
          lizard backend frontend/src -l py,js,vue -x 0 \
            --CCN 15 --warnings_only \
            > artifacts/code-metrics/lizard-warnings.txt 2>&1 || true
        continue-on-error: true

      - name: Generate summary dashboard
        run: |
          python - <<'PY'
          import json, os
          import tomllib
          from datetime import datetime, timezone
          from html import escape

          import lizard

          with open("artifacts/code-metrics/cloc.json") as f:
              cloc = json.load(f)

          cloc_rows = ""
          total = cloc.get("SUM", {})
          for lang, v in cloc.items():
              if lang in ("header", "SUM"):
                  continue
              cloc_rows += f"<tr><td>{lang}</td><td>{v['nFiles']}</td><td>{v['code']}</td><td>{v['comment']}</td><td>{v['blank']}</td></tr>"

          lizard_rows = ""
          warnings = []
          ccn_values = []
          function_count = 0
          try:
              functions = []
              results = list(lizard.analyze(["backend", "frontend/src"]))
              for file_info in results:
                  file_name = getattr(file_info, "filename", "")
                  for func in getattr(file_info, "function_list", []):
                      function_count += 1
                      ccn_value = getattr(func, "cyclomatic_complexity", None)
                      loc_value = getattr(func, "nloc", "") or getattr(func, "length", "")
                      start_line = getattr(func, "start_line", "")
                      name = getattr(func, "name", "")
                      file_label = f"{file_name}:{start_line}" if start_line else file_name
                      functions.append(
                          {
                              "name": escape(str(name)),
                              "ccn": ccn_value if ccn_value is not None else "",
                              "loc": loc_value,
                              "file": escape(str(file_label)),
                              "ccn_value": ccn_value if isinstance(ccn_value, int) else -1,
                          }
                      )
              for row in functions:
                  ccn_value = row["ccn_value"] if row["ccn_value"] >= 0 else None
                  is_warning = ccn_value is not None and ccn_value > 15
                  if ccn_value is not None:
                      ccn_values.append(ccn_value)
                  if is_warning:
                      warnings.append((row["name"], row["ccn"], row["file"]))
                  row_class = ' class="warn-row"' if is_warning else ""
                  lizard_rows += f"<tr{row_class}><td>{row['name']}</td><td>{row['ccn']}</td><td>{row['loc']}</td><td class='file-col'>{row['file']}</td></tr>"
              if not lizard_rows:
                  lizard_rows = "<tr><td colspan='4'>No functions found by lizard.</td></tr>"
          except Exception as e:
              lizard_rows = f"<tr><td colspan='4'>Parse error: {e}</td></tr>"

          max_ccn = max(ccn_values) if ccn_values else 0
          avg_ccn = (sum(ccn_values) / len(ccn_values)) if ccn_values else 0
          warning_count = len(warnings)
          warning_summary = f"{warning_count} warnings" if warning_count else "No warnings"
          complexity_note = f"Current run analyzed {function_count} functions. Highlighted rows exceed the CCN threshold of 15."

          backend_deps_list = []
          try:
              with open("pyproject.toml", "rb") as f:
                  pyproject = tomllib.load(f)
                  proj_deps = pyproject.get("project", {}).get("dependencies", [])
                  dev_deps = pyproject.get("dependency-groups", {}).get("dev", [])
                  for dep in proj_deps:
                      backend_deps_list.append({"type": "Runtime", "name": str(dep)})
                  for dep in dev_deps:
                      backend_deps_list.append({"type": "Development", "name": str(dep)})
          except Exception as e:
              print(f"Failed to read pyproject.toml: {e}")

          frontend_deps_list = []
          try:
              with open("frontend/package.json", "r", encoding="utf-8") as f:
                  pkg = json.load(f)
                  for k, v in pkg.get("dependencies", {}).items():
                      frontend_deps_list.append({"type": "Runtime", "name": f"{k} ({v})"})
                  for k, v in pkg.get("devDependencies", {}).items():
                      frontend_deps_list.append({"type": "Development", "name": f"{k} ({v})"})
          except Exception as e:
              print(f"Failed to read package.json: {e}")

          deps_rows = ""
          for dep in backend_deps_list:
              deps_rows += f"<tr><td>Backend (pip/uv)</td><td>{escape(dep['type'])}</td><td>{escape(dep['name'])}</td></tr>"
          for dep in frontend_deps_list:
              deps_rows += f"<tr><td>Frontend (npm)</td><td>{escape(dep['type'])}</td><td>{escape(dep['name'])}</td></tr>"
          if not deps_rows:
              deps_rows = "<tr><td colspan='3'>No dependencies found.</td></tr>"

          total_deps = len(backend_deps_list) + len(frontend_deps_list)
          total_runtime = sum(1 for d in backend_deps_list + frontend_deps_list if d["type"] == "Runtime")
          total_dev = sum(1 for d in backend_deps_list + frontend_deps_list if d["type"] == "Development")

          html = f"""<!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Code Metrics Report</title>
          <style>
            :root{{--bg:#f3f6fb;--panel:#ffffff;--ink:#102033;--muted:#667085;--line:#d7deea;--accent:#1d4ed8;--warn:#fff3c4;}}
            *{{box-sizing:border-box;}}
            body{{margin:0;background:linear-gradient(180deg,#eef4ff 0%,#f8fafc 42%,#f3f6fb 100%);color:var(--ink);font-family:Arial,sans-serif;padding:32px 20px;}}
            .page{{max-width:1180px;margin:0 auto;}}
            .hero{{background:linear-gradient(135deg,#102a43 0%,#1d4ed8 58%,#5b8def 100%);color:#fff;border-radius:24px;padding:28px 30px;box-shadow:0 18px 48px rgba(16,42,67,.18);margin-bottom:22px;}}
            .eyebrow{{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.74;margin-bottom:10px;}}
            h1{{font-size:34px;line-height:1.05;margin:0 0 8px;}}
            .hero-copy{{max-width:760px;font-size:15px;line-height:1.6;opacity:.92;margin:0 0 18px;}}
            .meta{{font-size:12px;opacity:.82;display:flex;gap:14px;flex-wrap:wrap;}}
            .tabs{{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--line);padding-bottom:1px;}}
            .tab-btn{{background:transparent;border:none;border-bottom:3px solid transparent;padding:12px 16px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;}}
            .tab-btn:hover{{color:var(--ink);}}
            .tab-btn.active{{color:var(--accent);border-bottom-color:var(--accent);}}
            .tab-content{{display:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 24px rgba(15,23,42,.05);}}
            .tab-content.active{{display:block;}}
            h2{{font-size:20px;margin:0 0 6px;}}
            .section-note{{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.5;}}
            .summary-grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}}
            .summary-card{{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}}
            .summary-card .label{{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}}
            .summary-card .value{{font-size:26px;font-weight:700;color:var(--accent);line-height:1.1;}}
            table{{width:100%;border-collapse:collapse;overflow:hidden;border-radius:8px;border:1px solid var(--line);}}
            th{{background:#f8fafc;font-size:12px;text-transform:uppercase;text-align:left;padding:12px 14px;color:var(--muted);border-bottom:1px solid var(--line);}}
            td{{font-size:14px;padding:12px 14px;border-top:1px solid #edf1f7;vertical-align:top;}}
            tbody tr:nth-child(even){{background:#fafcff;}}
            .warn-row{{background:var(--warn) !important;}}
            .file-col{{font-size:12px;color:var(--muted);}}
          </style></head><body>
          <div class="page">
            <section class="hero">
              <div class="eyebrow">Automated Repository Summary</div>
              <h1>Code Metrics Report</h1>
              <p class="hero-copy">A quick view of project size, complexity, and dependencies.</p>
              <div class="meta">
                <span>Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}</span>
                <span>Repo: {os.environ.get('GITHUB_REPOSITORY','N/A')}</span>
                <span>SHA: {os.environ.get('GITHUB_SHA','N/A')[:8]}</span>
              </div>
            </section>

            <div class="tabs">
              <button class="tab-btn active" onclick="openTab('cloc', event)">Lines of Code (cloc)</button>
              <button class="tab-btn" onclick="openTab('lizard', event)">Cyclomatic Complexity (lizard)</button>
              <button class="tab-btn" onclick="openTab('deps', event)">Dependencies</button>
            </div>

            <div id="cloc" class="tab-content active">
              <h2>Lines by file category</h2>
              <p class="section-note">Source file and line-count breakdown produced by cloc.</p>
              <div class="summary-grid">
                <div class="summary-card"><div class="label">Lines of code</div><div class="value">{total.get('code',0):,}</div></div>
                <div class="summary-card"><div class="label">Source files</div><div class="value">{total.get('nFiles',0)}</div></div>
                <div class="summary-card"><div class="label">Comment lines</div><div class="value">{total.get('comment',0):,}</div></div>
                <div class="summary-card"><div class="label">Blank lines</div><div class="value">{total.get('blank',0):,}</div></div>
              </div>
              <table><thead><tr><th>Language</th><th>Files</th><th>Code</th><th>Comment</th><th>Blank</th></tr></thead>
              <tbody>{cloc_rows}</tbody></table>
            </div>

            <div id="lizard" class="tab-content">
              <h2>Cyclomatic Complexity</h2>
              <p class="section-note">{complexity_note}</p>
              <div class="summary-grid">
                <div class="summary-card"><div class="label">Average CCN</div><div class="value">{avg_ccn:.2f}</div></div>
                <div class="summary-card"><div class="label">Functions analyzed</div><div class="value">{function_count}</div></div>
                <div class="summary-card"><div class="label">Max CCN</div><div class="value">{max_ccn}</div></div>
                <div class="summary-card"><div class="label">Warnings</div><div class="value">{warning_summary}</div></div>
              </div>
              <table><thead><tr><th>Function</th><th>CCN</th><th>LOC</th><th>File</th></tr></thead>
              <tbody>{lizard_rows}</tbody></table>
            </div>

            <div id="deps" class="tab-content">
              <h2>Dependencies Overview</h2>
              <p class="section-note">Tracking pip (backend) and npm (frontend) packages.</p>
              <div class="summary-grid">
                <div class="summary-card"><div class="label">Total Dependencies</div><div class="value">{total_deps}</div></div>
                <div class="summary-card"><div class="label">Backend (pip/uv)</div><div class="value">{len(backend_deps_list)}</div></div>
                <div class="summary-card"><div class="label">Frontend (npm)</div><div class="value">{len(frontend_deps_list)}</div></div>
                <div class="summary-card"><div class="label">Runtime / Dev</div><div class="value">{total_runtime} / {total_dev}</div></div>
              </div>
              <table><thead><tr><th>Ecosystem</th><th>Type</th><th>Package Details</th></tr></thead>
              <tbody>{deps_rows}</tbody></table>
            </div>
          </div>
          <script>
            function openTab(id, e) {{
              document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
              document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
              document.getElementById(id).classList.add('active');
              e.currentTarget.classList.add('active');
            }}
          </script>
          </body></html>"""

          with open("artifacts/code-metrics/lizard-summary.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "function_count": function_count,
                      "max_ccn": max_ccn,
                      "avg_ccn": round(avg_ccn, 2),
                      "warning_count": warning_count,
                  },
                  f,
                  indent=2,
              )
          with open("artifacts/code-metrics/report.html", "w") as f:
              f.write(html)
          print("Report written.")
          PY

      - name: Upload code metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: code-metrics
          path: artifacts/code-metrics
          retention-days: 14

  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Python dependency audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/security
          uv run pip-audit \
            --progress-spinner off \
            --format json \
            --output artifacts/security/pip-audit.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production dependency audit
        working-directory: frontend
        continue-on-error: true
        run: |
          mkdir -p ../artifacts/security
          npm audit --audit-level=high --omit=dev --json > ../artifacts/security/npm-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: artifacts/security
          retention-days: 14

  codeql:
    name: CodeQL static security analysis
    runs-on: ubuntu-latest
    if: vars.ENABLE_CODEQL == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

  docs:
    name: Generate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install documentation dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Build documentation site
        run: uv run mkdocs build --site-dir artifacts/docs-site

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v5
        with:
          name: docs-site
          path: artifacts/docs-site
          retention-days: 14

  package:
    name: Assemble release bundle
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
      - code-analysis
      - docs
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v5
        with:
          name: build-outputs
          path: release/build

      - name: Download documentation site
        uses: actions/download-artifact@v5
        with:
          name: docs-site
          path: release/docs

      - name: Download code metrics
        uses: actions/download-artifact@v5
        with:
          name: code-metrics
          path: release/code-metrics

      - name: Create release manifest
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "sha": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "contents": ["backend wheel", "frontend dist", "documentation site", "code metrics report"],
          }
          os.makedirs("release", exist_ok=True)
          with open("release/deployment-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: release-bundle
          path: release
          retention-days: 30

  deploy-testing:
    name: Deploy to testing environment
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev-pydanticAI' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/codex/'))
    environment:
      name: testing
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: release

      - name: Deployment placeholder
        run: |
          echo "Testing deployment gate passed."
          echo "Replace this step with the testing server/cloud deployment command."
          cat release/deployment-manifest.json

  deploy-production:
    name: Deploy to production environment
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: release

      - name: Deployment placeholder
        run: |
          echo "Production deployment gate passed."
          echo "Configure required reviewers on the production environment before adding real deployment."
          cat release/deployment-manifest.json
