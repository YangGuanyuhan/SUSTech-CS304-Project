[project]
name = "student-productivity-agent"
version = "0.1.0"
description = "A modular student productivity agent for software engineering coursework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "aiofiles>=23.2.0",
  "aiosmtplib>=3.0.1",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "cryptography>=46.0.7",
  "httpx>=0.27.0",
  "markitdown[pdf,docx,pptx]>=0.1.1",
  "openai>=2.30.0",
  "pydantic>=2.8.2",
  "pydantic-ai>=1.61.0,<1.75.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=6.0.0",
  "pyyaml>=6.0.0",
  "python-multipart>=0.0.27",
  "raganything>=1.2.10",
  "requests>=2.32.3",
  "sse-starlette>=2.1.3",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "tiktoken>=0.8.0",
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "uvicorn>=0.30.6",
]

[dependency-groups]
dev = [
  "mkdocs>=1.6.1",
  "pip-audit>=2.9.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "respx>=0.21.1",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC240", "UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
